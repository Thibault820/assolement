<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Assolement">
<meta name="theme-color" content="#F3F2EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Assolement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#F3F2EC;--ink:#1D1F1A;--mut:#5C5F55;--line:#EEEDE6;--acc:#2F5D3A;--ok:#2F6B3D;--bad:#B5482F;--warn:#9A5B12}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#D9D7CF;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:700px){body{padding:20px 0}#app{height:calc(100% - 40px);max-width:430px;border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,.25)}}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.hd{padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.5px}
h2{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sync i{width:8px;height:8px;border-radius:4px;display:inline-block}
.sync.ok{color:var(--ok)}.sync.ok i{background:#2F8F4A}
.sync.wait{color:var(--mut)}.sync.wait i{background:#9A9C92}
.sync.off{color:var(--warn)}.sync.off i{background:#D9822B}
.sync.err{color:var(--bad)}.sync.err i{background:var(--bad)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 16px;display:flex;flex-direction:column;gap:10px}
.pill{height:36px;padding:0 12px;border-radius:18px;border:1px solid #C9C6BA;background:#fff;font-size:14px;white-space:nowrap;flex:none}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.warn{border-color:var(--bad);color:var(--bad);font-weight:600}
.pill.warn.on{background:var(--bad);color:#fff}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.tab{flex:none;height:calc(64px + env(safe-area-inset-bottom));padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #E0DED5;display:grid;grid-template-columns:repeat(3,1fr)}
.tab button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut)}
.tab button.on{color:var(--acc);font-weight:600}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cell{height:44px;border-radius:7px;display:flex;overflow:hidden;font-family:'IBM Plex Mono',monospace;font-weight:600;background:#ECEAE2}
.cell span{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.cell.proj{border:1.5px dashed rgba(29,31,26,.7)}
.cell.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.cell.split{gap:1px;background:#fff}
.chip{padding:5px 8px;border-radius:7px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.proj{border:1.5px dashed rgba(29,31,26,.7)}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:none}
.yearbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:4px}
.yearbar button{width:48px;height:48px;border:none;background:none;font-size:26px;color:var(--acc)}
.back{display:flex;align-items:center;gap:4px;height:44px;border:none;background:none;color:var(--acc);font-size:17px;padding:0}
.icobtn{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;flex:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:94%;overflow-y:auto;z-index:20}
.grab{width:40px;height:5px;border-radius:3px;background:#D3D1C8;align-self:center;flex:none}
.lbl{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.cbtn{height:44px;border-radius:11px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:15px;text-align:left;border:1px solid #D3D1C8;background:#fff;min-width:0}
.cbtn.on{border:2px solid var(--ink);background:var(--bg);font-weight:600}
.cdot{min-width:28px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;flex:none}
.big{height:52px;border-radius:14px;border:none;font-size:17px;font-weight:600}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:19}
.snack{position:absolute;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:14px;padding:0 6px 0 14px;min-height:52px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:15}
.snack span{flex:1;font-size:14px;padding:8px 0}
.snack button{height:40px;padding:0 14px;border:none;border-radius:10px;background:#F0DC3A;color:var(--ink);font-size:15px;font-weight:700;flex:none}
.menu{position:absolute;top:calc(env(safe-area-inset-top) + 58px);right:12px;width:260px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column;z-index:21}
.menu button{min-height:48px;border:none;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:0 16px;font-size:16px}
.menu button:last-child{border-bottom:none}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field textarea{height:46px;border-radius:12px;border:1px solid #C9C6BA;background:#fff;padding:0 12px;font-size:16px;outline:none}
.field input:focus{border:2px solid var(--ink)}
.input{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;background:#E6E4DC;border-radius:10px;color:var(--mut)}
.input input{border:none;background:transparent;flex:1;outline:none;color:var(--ink);font-size:16px;min-width:0}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
.empty{padding:30px 10px;text-align:center;color:var(--mut);font-size:15px}
.ok{color:var(--ok)}.bad{color:var(--bad);font-weight:500}
#login{position:absolute;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;justify-content:center;padding:24px}
#login form{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div id="app">
  <div id="login" hidden>
    <form id="loginForm">
      <h1>Assolement</h1>
      <div style="color:var(--mut);font-size:15px;margin-bottom:8px">EARL BIZET · connexion</div>
      <label class="field"><span class="lbl">E-mail</span><input id="lgMail" type="email" autocomplete="username" autocapitalize="off" required></label>
      <label class="field"><span class="lbl">Mot de passe</span><input id="lgPass" type="password" autocomplete="current-password" required></label>
      <div id="lgErr" class="bad" style="min-height:20px;font-size:14px"></div>
      <button id="lgBtn" class="big" style="background:var(--acc);color:#fff">Se connecter</button>
    </form>
  </div>
  <div id="view" class="scr"></div>
</div>
<script>
'use strict';
// ====================== DONNÉES ======================
// Même format que la version PC (pc.html) : rows = [{id, ilot, name, surface, hist:[2018..2025], future:[2026..]}]
// Ajouts de la version iPhone (ignorés par la version PC) : row.splits = {"2028":[{c:"PDT",ha:6.1},{c:"Blé",ha:3.48}]}, row.note
var H0 = 2018, NHIST = 8;
var YEARS_FUT = [2026,2027,2028,2029,2030];
var ROWS = [];
var CROPS = {
  'Blé':['Blé','B','#C99A3B','#1D1F1A'],
  'Orge hiver':['Orge hiver','OH','#A9B84E','#1D1F1A'],
  'Orge printemps':['Orge printemps','OP','#D7DE9B','#1D1F1A'],
  'Colza':['Colza','C','#F0DC3A','#1D1F1A'],
  'Maïs':['Maïs','M','#E9832E','#1D1F1A'],
  'Betterave':['Betterave','BT','#8E3B8C','#FFFFFF'],
  'PDT':['PDT','P','#6B4A2E','#FFFFFF'],
  'Féverole':['Féverole','F','#3E8E5A','#FFFFFF'],
  'Pois':['Pois','PS','#3F6F9E','#FFFFFF'],
  'Luzerne':['Luzerne','L','#9CC08A','#1D1F1A'],
  'Avoine':['Avoine','AV','#E0C89A','#1D1F1A'],
  'Jachère':['Jachère','J','#CFCBBE','#1D1F1A'],
  'Prairie':['Prairie','PR','#7FB07A','#1D1F1A'],
  'Autres':['Autres','A','#BDBBB2','#1D1F1A'],
  '':['À définir','—','#ECEAE2','#5C5F55']
};
var MAIN_CROPS = ['Blé','Orge hiver','Orge printemps','Colza','Maïs','Betterave','PDT','Féverole','Pois','Jachère'];
var OTHER_CROPS = ['Luzerne','Avoine','Prairie','Autres',''];
function crop(c){ return CROPS[c] || [c || 'À définir', (c||'—').slice(0,2), '#BDBBB2', '#1D1F1A']; }

// Règles (alertes seulement, jamais de modification automatique)
var MIN_RETOUR = {'PDT':5,'Betterave':4,'Colza':6,'Maïs':2,'Féverole':5};
var SENSIBLES = ['PDT','Betterave','Colza','Maïs'];
var CIBLES = [['Betterave',['Betterave'],14,15],['Maïs',['Maïs'],17,22],['PDT',['PDT'],13,20],['Colza',['Colza'],7,10],['Orge',['Orge hiver','Orge printemps'],5,10],['Féverole',['Féverole'],5,6]];

function lastYear(){ return H0 + NHIST + YEARS_FUT.length - 1; }
function yearsAll(){ var a=[]; for(var y=H0;y<=lastYear();y++)a.push(y); return a; }
function getCrop(r,y){ var i=y-H0; if(i<0)return ''; return (i<NHIST ? (r.hist||[])[i] : (r.future||[])[i-NHIST]) || ''; }
function setCrop(r,y,c){ var i=y-H0; if(i<NHIST){ r.hist=r.hist||[]; r.hist[i]=c; } else { r.future=r.future||[]; r.future[i-NHIST]=c; } }
function surf(r){ return parseFloat(r.surface)||0; }
function parts(r,y){
  var s = r.splits && r.splits[y];
  if(s && s.length>1) return s.map(function(p){return {c:p.c, ha:parseFloat(p.ha)||0};});
  return [{c:getCrop(r,y), ha:surf(r)}];
}
function cropsAt(r,y){ return parts(r,y).map(function(p){return p.c;}); }
function has(r,y,c){ return cropsAt(r,y).indexOf(c)>=0; }
function allBle(r,y){ return cropsAt(r,y).every(function(c){ return c==='Blé'; }); } // année divisée = pas un blé « plein »
var NOW = new Date();
function realise(y){ return y < NOW.getFullYear() || (y===NOW.getFullYear() && NOW.getMonth()>=7); }
var NEXT = NOW.getMonth()>=7 ? NOW.getFullYear()+1 : NOW.getFullYear();

// ====================== OUTILS ======================
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function ha(v){ return (Math.round(v*100)/100).toFixed(2).replace('.',','); }
function ha1(v){ return (Math.round(v*10)/10).toFixed(1).replace('.',','); }
function num(v){ var x=parseFloat(String(v).replace(',','.')); return isNaN(x)?null:x; }
function rowById(id){ for(var i=0;i<ROWS.length;i++) if(ROWS[i].id===id) return ROWS[i]; return null; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function hhmm(d){ return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function dmy(d){ return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }

// ====================== RÈGLES ======================
function rowAlerts(r, from){
  var out=[], Y=lastYear(), y, c, p, k;
  from = from || NEXT;
  for(y=from;y<=Y;y++){
    var cs = cropsAt(r,y);
    for(k=0;k<cs.length;k++){
      c=cs[k];
      if(MIN_RETOUR[c]){
        for(p=y-1;p>=H0;p--){ if(has(r,p,c)) break; }
        if(p>=H0 && y-p<MIN_RETOUR[c]) out.push({y:y,t:c+' '+y+' : retour en '+(y-p)+' an'+(y-p>1?'s':'')+' (min. '+MIN_RETOUR[c]+')'});
      }
      if(SENSIBLES.indexOf(c)>=0){
        var av=cropsAt(r,y-1), ap=y<Y?cropsAt(r,y+1):null;
        if(y-1>=H0 && av[0]!=='' && av.indexOf('Blé')<0) out.push({y:y,t:c+' '+y+' : pas de blé avant'});
        if(ap && ap[0]!=='' && ap.indexOf('Blé')<0) out.push({y:y,t:c+' '+y+' : pas de blé après'});
        if(['PDT','Betterave','Maïs'].indexOf(c)>=0){
          var jamais=true; for(var h=H0;h<H0+NHIST;h++){ if(has(r,h,c)){jamais=false;break;} }
          if(jamais) out.push({y:y,t:c+' '+y+' : jamais eu de '+c+' sur cette parcelle'});
        }
      }
    }
    if(y-2>=H0 && allBle(r,y) && allBle(r,y-1) && allBle(r,y-2)) out.push({y:y,t:'Blé '+y+' : 3e blé de suite'});
  }
  return out;
}
function totals(y, rows){
  var t={}; (rows||ROWS).forEach(function(r){ parts(r,y).forEach(function(p){ t[p.c]=(t[p.c]||0)+p.ha; }); });
  return t;
}
function farmAlerts(y, rows){
  var t=totals(y,rows), out=[];
  if((t['Orge hiver']||0)>0 && (t['Orge printemps']||0)>0) out.push({k:'orge',t:'Ferme '+y+' : orge d’hiver ET de printemps'});
  if((t['Féverole']||0)>0 && (t['Pois']||0)>0) out.push({k:'leg',t:'Ferme '+y+' : féverole ET pois'});
  if(!realise(y)) CIBLES.forEach(function(ci){
    var v=ci[1].reduce(function(s,c){return s+(t[c]||0);},0);
    if(v<ci[2]-0.005||v>ci[3]+0.005) out.push({k:ci[0],t:'Ferme '+y+' : '+ci[0].toLowerCase()+' '+ha1(v)+' ha (cible '+ci[2]+'–'+ci[3]+')'});
  });
  return out;
}

// ====================== ÉTAT DE L'ÉCRAN ======================
var S = { scr:'parcelles', year:NEXT, rowId:null, filter:'all', q:'', hist:false, sheet:null, menu:null, open:null, snack:null, edit:null, others:false };
var UNDO = [];
var LOG = [];
var sync = {cls:'wait', txt:'Chargement…'};

// ====================== RENDU ======================
var IC = {
 par:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 10h18M3 15h18" stroke="currentColor" stroke-width="1.8"/></svg>',
 cam:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
 bil:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
 chev:'<svg width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6" stroke="#9A9C92" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
 dots:'<svg width="22" height="6" viewBox="0 0 22 6" aria-hidden="true"><circle cx="3" cy="3" r="2.4" fill="#2F5D3A"/><circle cx="11" cy="3" r="2.4" fill="#2F5D3A"/><circle cx="19" cy="3" r="2.4" fill="#2F5D3A"/></svg>',
 back:'<svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2L2 10l8 8" stroke="#2F5D3A" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
 loupe:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="#5C5F55" stroke-width="1.6" fill="none"/><path d="M11 11l3.5 3.5" stroke="#5C5F55" stroke-width="1.6" stroke-linecap="round"/></svg>'
};
function syncHTML(){ return '<span class="sync '+sync.cls+'"><i></i>'+esc(sync.txt)+'</span>'; }
function tabs(on){
  return '<nav class="tab">'+[['parcelles','par','Parcelles'],['campagne','cam','Campagne'],['bilan','bil','Bilan']].map(function(t){
    return '<button class="'+(on===t[0]?'on':'')+'" data-go="'+t[0]+'">'+IC[t[1]]+t[2]+'</button>';
  }).join('')+'</nav>';
}
function yearbar(sub){
  return '<div class="yearbar"><button aria-label="Année précédente" data-yr="-1">‹</button>'+
    '<div style="display:flex;flex-direction:column;align-items:center"><span style="font-size:20px;font-weight:700">Récolte '+S.year+'</span>'+
    '<span style="font-size:13px;color:var(--mut)">'+sub+'</span></div><button aria-label="Année suivante" data-yr="1">›</button></div>';
}
function cellHTML(r,y){
  var ps=parts(r,y), cls='cell'+(ps.length>1?' split':'')+(realise(y)?'':' proj')+(y===S.year?' cur':'');
  return '<div class="'+cls+'">'+ps.map(function(p){ var k=crop(p.c); return '<span style="background:'+k[2]+';color:'+k[3]+';font-size:'+(ps.length>1?(ps.length>2?'11px':'14px'):'17px')+'">'+esc(k[1])+'</span>'; }).join('')+'</div>';
}
function chipHTML(p,y,showHa){
  var k=crop(p.c);
  return '<span class="chip'+(realise(y)?'':' proj')+'" style="background:'+k[2]+';color:'+k[3]+'">'+esc(k[0])+(showHa?' '+ha(p.ha):'')+'</span>';
}
function windowFrom(){ var f=S.year-3; f=Math.max(H0,Math.min(f,lastYear()-6)); return f; }
function filtered(){
  var q=S.q.trim().toLowerCase();
  return ROWS.filter(function(r){
    if(q && (String(r.name||'')+' '+String(r.ilot||'')).toLowerCase().indexOf(q)<0) return false;
    if(S.filter==='pdt'){ for(var y=H0;y<=lastYear();y++) if(has(r,y,'PDT')) return true; return false; }
    if(S.filter==='warn') return rowAlerts(r).length>0;
    return true;
  });
}
function nbWarn(){ return ROWS.filter(function(r){return rowAlerts(r).length>0;}).length; }

function scrParcelles(){
  var from=windowFrom(), yrs='', i;
  for(i=0;i<7;i++){ var y=from+i; yrs+='<span style="'+(y===S.year?'color:var(--ink);font-weight:600':'')+'">\''+String(y).slice(2)+'</span>'; }
  var legend=MAIN_CROPS.concat(OTHER_CROPS.slice(0,4)).map(function(c){var k=crop(c);return '<span style="padding:4px 8px;border-radius:6px;font-size:13px;font-weight:600;background:'+k[2]+';color:'+k[3]+'">'+esc(k[1]+' '+k[0])+'</span>';}).join('');
  var nw=nbWarn();
  return '<div class="scr"><div class="hd">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><h1>Parcelles</h1>'+syncHTML()+'</div>'+
    '<div style="display:flex;align-items:center;gap:2px"><div style="display:flex;align-items:center;background:var(--acc);color:#fff;border-radius:22px;padding:0 2px">'+
      '<button aria-label="Année précédente" data-yr="-1" style="width:34px;height:44px;border:none;background:none;color:#fff;font-size:22px">‹</button>'+
      '<span style="font-size:15px;font-weight:600;white-space:nowrap">Récolte '+S.year+'</span>'+
      '<button aria-label="Année suivante" data-yr="1" style="width:34px;height:44px;border:none;background:none;color:#fff;font-size:22px">›</button></div>'+
      '<button class="icobtn" aria-label="Menu" data-menu="main">'+IC.dots+'</button></div></div>'+
    '<label class="input">'+IC.loupe+'<input id="q" type="search" placeholder="Rechercher une parcelle" value="'+esc(S.q)+'"></label>'+
    '<div style="display:flex;gap:8px;overflow-x:auto">'+
      '<button class="pill'+(S.filter==='all'?' on':'')+'" data-filter="all">Toutes · '+ROWS.length+'</button>'+

function sheetEdit(){
  var r=rowById(S.rowId), E=S.edit, n=E.parts.length, split=n>1, i, sum=0;
  var P=E.parts.map(function(p){return {c:p.c,ha:p.ha};});
  for(i=0;i<n-1;i++) sum+=P[i].ha;
  if(split) P[n-1].ha=Math.max(0,surf(r)-sum); else P[0].ha=surf(r);

    '<div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;flex-direction:column;min-width:0"><span style="font-size:13px;color:var(--mut)">'+esc(r.name)+' · '+ha(surf(r))+' ha</span><h2 style="font-size:22px">Récolte '+E.y+(realise(E.y)?' <span style="font-size:13px;color:var(--mut);font-weight:500">(réalisé)</span>':'')+'</h2></div>'+

      return '<button data-part="'+i+'" style="flex:1;min-width:0;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;'+(on?'border:2px solid var(--ink);background:var(--bg)':'border:1px solid #D3D1C8;background:#fff')+'"><span style="font-size:12px;color:var(--mut)">Partie '+(i+1)+(i===n-1?' · reste':'')+'</span><span style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">'+esc(crop(p.c)[0])+'</span><span class="mono" style="font-size:13px">'+ha(p.ha)+' ha</span></button>';}).join('')+
      (n<3?'<button aria-label="Ajouter une partie" data-addpart="1" style="width:48px;border-radius:12px;border:1px dashed #9A9C92;background:#fff;font-size:22px;color:var(--acc);flex:none">+</button>':'')+
      '</div><button data-unsplit="1" style="align-self:flex-start;height:32px;padding:0;border:none;background:none;color:var(--bad);font-size:14px">Ne plus diviser cette année</button></div>';
  } else {
    h+='<button data-split="1" style="height:44px;border-radius:12px;border:1px dashed var(--acc);background:#fff;color:var(--acc);font-size:15px;font-weight:600;flex:none">Diviser cette année en 2 ou 3 parties</button>';
  }
  var list=MAIN_CROPS.concat(S.others||OTHER_CROPS.indexOf(picked)>=0?OTHER_CROPS:[]);
  h+='<div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Culture'+(split?' · partie '+(a+1):'')+'</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">'+
    list.map(function(c){var k=crop(c);return '<button class="cbtn'+(c===picked?' on':'')+'" data-crop="'+esc(c)+'"><span class="cdot" style="background:'+k[2]+';color:'+k[3]+'">'+esc(k[1])+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(k[0])+'</span></button>';}).join('')+
    (S.others||OTHER_CROPS.indexOf(picked)>=0?'':'<button class="cbtn" data-others="1" style="justify-content:center;color:var(--acc);font-weight:600">Autres cultures…</button>')+'</div></div>';
  if(split){
    h+='<div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="flex:1">Surface · partie '+(a+1)+'</span>'+
      (a===n-1?'<span class="mono" style="height:44px;padding:0 14px;border-radius:12px;background:#F0EFE9;display:flex;align-items:center;font-size:18px;color:var(--mut)">'+ha(P[a].ha)+' ha · reste</span>'
      :'<label class="mono" style="height:44px;padding:0 12px;border-radius:12px;background:#F0EFE9;border:2px solid var(--ink);display:flex;align-items:center;gap:4px;font-size:18px"><input id="haIn" value="'+ha(P[a].ha)+'" inputmode="decimal" aria-label="Surface en hectares" style="width:72px;border:none;background:transparent;text-align:right;outline:none;font-size:18px"> ha</label>')+'</div>';

  var bad=rowAlerts(tr,Math.max(H0,E.y-1)).filter(function(x){return x.y<=E.y+6;});
  var fbad=farmAlerts(E.y,tmp).filter(function(x){ return touches(x,P); });
  var msgs=bad.map(function(x){return '<div class="bad">⚠ '+esc(x.t)+'</div>';}).concat(fbad.map(function(x){return '<div class="bad">⚠ '+esc(x.t)+'</div>';}));

    '<button class="big" data-save="1" style="color:#fff;background:'+(nb?'var(--bad);font-size:15px':'var(--acc)')+'">'+(nb?'Enregistrer quand même':'Enregistrer')+'</button></div></div>';
  return h;

function touches(a,P){
  var cs=P.map(function(p){return p.c;});
  if(a.k==='orge') return cs.indexOf('Orge hiver')>=0||cs.indexOf('Orge printemps')>=0;
  if(a.k==='leg') return cs.indexOf('Féverole')>=0||cs.indexOf('Pois')>=0;
  var ci=null; CIBLES.forEach(function(x){ if(x[0]===a.k) ci=x; });
  return ci ? cs.some(function(c){return ci[1].indexOf(c)>=0;}) : false;
}
function applyEdit(r,y,P){
  setCrop(r,y,P[0].c);
  r.splits=r.splits||{};
  if(P.length>1){ r.splits[y]=P.map(function(p){return {c:p.c, ha:Math.round(p.ha*100)/100};}); }
  else { delete r.splits[y]; }
  if(!Object.keys(r.splits).length) delete r.splits;
  return r;
}

function menuHTML(){
  if(S.menu==='row') return '<div class="dim" data-close="1" style="background:transparent"></div><div class="menu"><button data-act="rename">Renommer / surface / îlot</button><button data-act="dup">Dupliquer la parcelle</button><button data-act="log">Historique des modifs</button><button data-act="del" style="color:var(--bad)">Supprimer la parcelle</button></div>';
  return '<div class="dim" data-close="1" style="background:transparent"></div><div class="menu"><button data-act="add">Ajouter une parcelle</button><button data-act="addyear">Ajouter l’année '+(lastYear()+1)+'</button><button data-act="logall">Historique des modifs</button><button data-act="export">Télécharger une sauvegarde</button><button data-act="pc">Version PC (tableau)</button><button data-act="logout" style="color:var(--bad)">Se déconnecter</button></div>';
}

var scrollMem={};
function render(){
  var v=document.getElementById('view'), b=v.querySelector('.body');
  if(b) scrollMem[v.dataset.scr]=b.scrollTop;
  var h;
  if(S.scr==='campagne') h=scrCampagne(); else if(S.scr==='bilan') h=scrBilan(); else if(S.scr==='fiche') h=scrFiche(); else h=scrParcelles();
  if(S.menu) h+=menuHTML();
  if(S.sheet==='edit') h+=sheetEdit();
  else if(S.sheet==='rename'||S.sheet==='add') h+=sheetRename();
  else if(S.sheet==='log'||S.sheet==='logall') h+=sheetLog();
  if(S.snack) h+='<div class="snack"><span>'+esc(S.snack)+'</span>'+(UNDO.length?'<button data-undo="1">Annuler</button>':'')+'</div>';
  v.innerHTML=h; v.dataset.scr=S.scr+(S.scr==='fiche'?S.rowId:'');
  var nb=v.querySelector('.body'); if(nb && scrollMem[v.dataset.scr]!=null) nb.scrollTop=scrollMem[v.dataset.scr];
}
function set(o){ for(var k in o) S[k]=o[k]; render(); }
var snackTimer=null;
function snack(t){ S.snack=t; clearTimeout(snackTimer); snackTimer=setTimeout(function(){ S.snack=null; render(); },8000); }

// ====================== ACTIONS ======================
function commit(what, rowId){
  var r=rowId?rowById(rowId):null;
  LOGQ.push({at:new Date().toISOString(), by:(auth.currentUser&&auth.currentUser.email)||'', row:rowId||'', name:r?r.name:'', what:what});
  scheduleSave();
}
function pushUndo(label){ UNDO.push({rows:JSON.stringify(ROWS), fut:YEARS_FUT.slice(), label:label}); if(UNDO.length>30) UNDO.shift(); }

document.getElementById('view').addEventListener('click', function(e){
  var t=e.target.closest('button,[data-close]'); if(!t) return;
  var d=t.dataset;
  if(d.go){ set({scr:d.go, sheet:null, menu:null, hist:false}); return; }
  if(d.yr){ var y=S.year+parseInt(d.yr,10); y=Math.max(H0,Math.min(lastYear(),y)); set({year:y}); return; }
  if(d.filter){ set({filter:d.filter}); return; }
  if(d.row){ S.from=S.scr; set({scr:'fiche', rowId:d.row, hist:false, menu:null}); return; }
  if(d.hist){ set({hist:!S.hist}); return; }
  if(d.open){ set({open:S.open===d.open?null:d.open}); return; }
  if(d.menu){ set({menu:S.menu?null:d.menu}); return; }
  if(d.close){ set({sheet:null, menu:null, edit:null, others:false}); return; }
  if(d.edit){ var r=rowById(S.rowId), y2=parseInt(d.edit,10); set({sheet:'edit', others:false, edit:{y:y2, parts:parts(r,y2), active:0}}); return; }
  if(d.part){ S.edit.active=parseInt(d.part,10); render(); return; }
  if(d.crop!=null && S.edit){ S.edit.parts[Math.min(S.edit.active,S.edit.parts.length-1)].c=d.crop; render(); return; }
  if(d.others){ set({others:true}); return; }
  if(d.split){ var rr=rowById(S.rowId), s0=surf(rr); S.edit.parts=[{c:S.edit.parts[0].c, ha:Math.round(s0*0.6*100)/100},{c:'Blé',ha:0}]; S.edit.active=0; render(); setTimeout(function(){var i=document.getElementById('haIn'); if(i){i.focus(); i.select();}},50); return; }
  if(d.unsplit){ S.edit.parts=[{c:S.edit.parts[0].c, ha:0}]; S.edit.active=0; render(); return; }
  if(d.addpart){ var P=S.edit.parts, rs=surf(rowById(S.rowId)), used=0; for(var i=0;i<P.length-1;i++) used+=P[i].ha; var rest=Math.max(0,rs-used); P[P.length-1].ha=Math.round(rest/2*100)/100; P.push({c:'',ha:0}); S.edit.active=P.length-1; render(); return; }
  if(d.save){ saveEdit(); return; }
  if(d.saverow){ saveRow(); return; }
  if(d.undo){ undo(); return; }
  if(d.act){ action(d.act); return; }
});
document.getElementById('view').addEventListener('input', function(e){
  if(e.target.id==='q'){ S.q=e.target.value; var l=document.getElementById('list'); if(l){ var keep=l.firstChild; l.innerHTML=''; l.appendChild(keep); l.insertAdjacentHTML('beforeend', listHTML(windowFrom())); } }
});
document.getElementById('view').addEventListener('change', function(e){
  if(e.target.id==='haIn' && S.edit){
    var v=num(e.target.value), r=rowById(S.rowId); if(v==null) return;
    var P=S.edit.parts, a=S.edit.active, others=0; for(var i=0;i<P.length-1;i++) if(i!==a) others+=P[i].ha;
    P[a].ha=Math.max(0,Math.min(v, surf(r)-others)); render();
  }
  if(e.target.id==='note'){
    var r2=rowById(S.rowId); if(!r2) return; var nv=e.target.value.trim(); if((r2.note||'')===nv) return;
    pushUndo('note'); if(nv) r2.note=nv; else delete r2.note; commit('Note : '+(nv||'(effacée)'), r2.id); snack('Note enregistrée'); render();
  }
});
document.getElementById('view').addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='haIn'){ e.target.blur(); } });

function describe(P){ return P.map(function(p){ return crop(p.c)[0]+(P.length>1?' '+ha(p.ha):''); }).join(' + '); }
function saveEdit(){
  var hi=document.getElementById('haIn'); if(hi && document.activeElement===hi){ hi.blur(); }
  var r=rowById(S.rowId), E=S.edit, P=E.parts.map(function(p){return {c:p.c,ha:p.ha};}), n=P.length, sum=0, i;
  for(i=0;i<n-1;i++) sum+=P[i].ha;
  if(n>1){ P[n-1].ha=Math.max(0,surf(r)-sum); if(P[n-1].ha<=0.004){ alert('La dernière partie n’a plus de surface : réduis les autres parties.'); return; } }
  var before=describe(parts(r,E.y)), after=describe(P.length>1?P:[{c:P[0].c,ha:surf(r)}]);
  if(before===after){ set({sheet:null, edit:null}); return; }
  pushUndo(r.name+' '+E.y);
  applyEdit(r,E.y,P);
  commit(E.y+' : '+before+' → '+after, r.id);
  S.sheet=null; S.edit=null; S.others=false;
  snack(r.name+' '+E.y+' : '+after); render();
}
function saveRow(){
  var name=document.getElementById('fName').value.trim(), s=num(document.getElementById('fSurf').value), il=document.getElementById('fIlot').value.trim();
  if(!name){ alert('Donne un nom à la parcelle.'); return; }
  if(s==null||s<=0){ alert('Surface invalide.'); return; }
  if(S.sheet==='add'){
    pushUndo('ajout');
    var r={id:'r'+Date.now(), ilot:il||'?', name:name, surface:s, hist:new Array(NHIST).fill(''), future:new Array(YEARS_FUT.length).fill('')};
    ROWS.push(r); commit('Parcelle ajoutée ('+ha(s)+' ha)', r.id);
    S.sheet=null; S.from='parcelles'; S.scr='fiche'; S.rowId=r.id; snack('Parcelle ajoutée'); render(); return;
  }
  var r2=rowById(S.rowId), ch=[];
  if(r2.name!==name) ch.push('nom « '+r2.name+' » → « '+name+' »');
  if(Math.abs(surf(r2)-s)>0.001) ch.push('surface '+ha(surf(r2))+' → '+ha(s)+' ha');
  if((r2.ilot||'?')!==(il||'?')) ch.push('îlot → '+(il||'?'));
  if(!ch.length){ set({sheet:null}); return; }
  pushUndo('parcelle'); r2.name=name; r2.surface=s; r2.ilot=il||'?';
  commit(ch.join(', '), r2.id); S.sheet=null; snack('Parcelle modifiée'); render();
}
function undo(){
  var u=UNDO.pop(); if(!u) return;
  ROWS=JSON.parse(u.rows); YEARS_FUT=u.fut;
  if(S.rowId && !rowById(S.rowId) && S.scr==='fiche') S.scr=S.from||'parcelles';
  commit('Annulation ('+u.label+')', S.rowId);
  snack('Modification annulée'); render();
}
function action(a){
  var r=rowById(S.rowId); S.menu=null;
  if(a==='rename'){ set({sheet:'rename'}); return; }
  if(a==='add'){ set({sheet:'add'}); return; }
  if(a==='log'){ set({sheet:'log'}); return; }
  if(a==='logall'){ set({sheet:'logall'}); return; }
  if(a==='dup'){ pushUndo('dupliquer'); var c=clone(r); c.id='r'+Date.now(); c.name=r.name+' (bis)'; ROWS.splice(ROWS.indexOf(r)+1,0,c); commit('Dupliquée depuis « '+r.name+' »', c.id); S.rowId=c.id; S.sheet='rename'; snack('Copie créée : renomme-la et règle sa surface'); render(); return; }
  if(a==='del'){ if(!confirm('Supprimer « '+r.name+' » ?')){ render(); return; } pushUndo('suppression'); commit('Parcelle supprimée : '+r.name+' ('+ha(surf(r))+' ha)', r.id); ROWS.splice(ROWS.indexOf(r),1); S.scr=S.from||'parcelles'; snack('Parcelle supprimée'); render(); return; }
  if(a==='addyear'){ pushUndo('année'); var ny=lastYear()+1; YEARS_FUT.push(ny); ROWS.forEach(function(x){ x.future=x.future||[]; while(x.future.length<YEARS_FUT.length) x.future.push(''); }); commit('Année '+ny+' ajoutée'); snack('Année '+ny+' ajoutée'); render(); return; }
  if(a==='export'){ var blob=new Blob([JSON.stringify({savedAt:new Date().toISOString(), yearsFut:YEARS_FUT, rows:ROWS},null,1)],{type:'application/json'}); var l=document.createElement('a'); l.href=URL.createObjectURL(blob); l.download='assolement_earl_bizet_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json'; l.click(); render(); return; }
  if(a==='pc'){ location.href='pc.html'; return; }
  if(a==='logout'){ if(confirm('Se déconnecter ?')) auth.signOut(); render(); return; }
}

firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(), db=firebase.database();
var REF_STATE=db.ref('assolement/state'), REF_BACKUP=db.ref('assolement/backups'), REF_LOG=db.ref('assolement/log');
var CLIENT_ID=Math.random().toString(36).slice(2);
var loaded=false, saveTimer=null, lastBackupDay=null, online=true, remoteAt=null, LOGQ=[];
var LS_CACHE='asso_cache_v1', LS_PEND='asso_pending_v1';
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
var PEND; // modifs pas encore envoyées (gardées aussi sur le téléphone)
function getPend(){ if(PEND===undefined) PEND=lsGet(LS_PEND); return PEND; }
function setPend(v){ PEND=v; lsSet(LS_PEND,v); }
function setSync(cls,txt){ sync={cls:cls,txt:txt}; var els=document.querySelectorAll('.sync'); for(var i=0;i<els.length;i++){ els[i].className='sync '+cls; els[i].innerHTML='<i></i>'+esc(txt); } }

function scheduleSave(){
  if(!loaded) return;
  var json=JSON.stringify({yearsFut:YEARS_FUT, rows:ROWS});
  var pend=getPend(); setPend({json:json, base: pend?pend.base:remoteAt, log:(pend&&pend.log||[]).concat(LOGQ)}); LOGQ=[];
  setSync(online?'wait':'off', online?'Enregistrement…':'Hors réseau · modifs en attente');
  clearTimeout(saveTimer); saveTimer=setTimeout(saveNow, 600);
}
function saveNow(){
  var pend=getPend(); if(!pend || !auth.currentUser) return;
  if(!online){ setSync('off','Hors réseau · modifs en attente'); return; }
  var now=new Date(), at=now.toISOString();
  REF_STATE.set({json:pend.json, savedAt:at, by:auth.currentUser.email, client:CLIENT_ID}).then(function(){
    remoteAt=at;
    var cur=getPend(); if(cur && cur.json===pend.json) setPend(null); else if(cur){ cur.base=at; cur.log=(cur.log||[]).slice((pend.log||[]).length); setPend(cur); }
    (pend.log||[]).forEach(function(l){ REF_LOG.push(l); });
    lsSet(LS_CACHE,{json:pend.json, savedAt:at, by:auth.currentUser.email});
    var day=at.slice(0,10); if(day!==lastBackupDay){ lastBackupDay=day; REF_BACKUP.child(day).set({json:pend.json, savedAt:at}); }
    setSync('ok','Synchronisé · '+hhmm(now));
  }, function(err){ setSync('err','Non enregistré : '+(err&&err.message||err)); });
}
function applyJSON(json){
  var data=JSON.parse(json);
  YEARS_FUT=(Array.isArray(data.yearsFut)&&data.yearsFut.length)?data.yearsFut.slice():[2026,2027,2028,2029,2030];
  ROWS=data.rows||[];
  var maxF=Math.max.apply(null,[YEARS_FUT.length].concat(ROWS.map(function(r){return (r.future||[]).length;})));
  while(YEARS_FUT.length<maxF) YEARS_FUT.push(YEARS_FUT[YEARS_FUT.length-1]+1);
  ROWS.forEach(function(r){ r.hist=r.hist||[]; r.future=r.future||[]; while(r.future.length<YEARS_FUT.length) r.future.push(''); });
  if(S.year>lastYear()) S.year=lastYear();
}
function onRemote(v){
  if(!v || !v.json){ if(!loaded){ ROWS=[]; loaded=true; render(); } setSync('wait','Aucune donnée en ligne'); return; }
  var pend=getPend();
  if(pend && !loaded){
    if(pend.base===v.savedAt){ remoteAt=v.savedAt; applyJSON(pend.json); loaded=true; render(); saveNow(); return; }
    setPend(null); loaded=true; applyJSON(v.json); remoteAt=v.savedAt; render();
    snack('Tes modifs hors réseau n’ont pas été envoyées : quelqu’un a modifié l’assolement entre-temps.'); render(); return;
  }
  if(loaded && v.client===CLIENT_ID){ remoteAt=v.savedAt; return; }
  if(pend && loaded) return; // nos modifs partent dans un instant
  remoteAt=v.savedAt; applyJSON(v.json); loaded=true;
  lsSet(LS_CACHE,{json:v.json, savedAt:v.savedAt, by:v.by});
  var t=v.savedAt?new Date(v.savedAt):null;
  sync={cls:'ok', txt:'Synchronisé'+(t?' · '+(t.toDateString()===new Date().toDateString()?hhmm(t):dmy(t))+(v.by&&auth.currentUser&&v.by!==auth.currentUser.email?' par '+v.by.split('@')[0]:''):'')};
  if(S.sheet==='edit' || S.sheet==='rename' || S.sheet==='add'){ setSync(sync.cls,sync.txt); return; } // ne pas fermer une saisie en cours
  render();
}
var listening=false;
auth.onAuthStateChanged(function(user){
  document.getElementById('login').hidden=!!user;
  if(user && !listening){
    listening=true;
    var c=lsGet(LS_CACHE), p=getPend();
    if(c && c.json){ applyJSON(p?p.json:c.json); remoteAt=c.savedAt; render(); setSync('wait','Connexion…'); }
    REF_STATE.on('value', function(s){ onRemote(s.val()); }, function(err){ setSync('err','Accès refusé : '+err.message); });
    REF_LOG.limitToLast(300).on('value', function(s){ var v=s.val()||{}; LOG=Object.keys(v).map(function(k){return v[k];}).sort(function(a,b){return a.at<b.at?1:-1;}); if(S.sheet==='log'||S.sheet==='logall') render(); });
    db.ref('.info/connected').on('value', function(s){
      online=s.val()===true;
      if(!online && loaded) setSync('off', getPend()?'Hors réseau · modifs en attente':'Hors réseau');
      if(online && getPend() && loaded) saveNow();
    });
  }
  if(!user && listening){ REF_STATE.off(); REF_LOG.off(); listening=false; loaded=false; ROWS=[]; lsSet(LS_CACHE,null); render(); }
});
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var err=document.getElementById('lgErr'), btn=document.getElementById('lgBtn');
  err.textContent=''; btn.disabled=true; btn.textContent='Connexion…';
  auth.signInWithEmailAndPassword(document.getElementById('lgMail').value.trim(), document.getElementById('lgPass').value).catch(function(x){
    var m={'auth/invalid-credential':'E-mail ou mot de passe incorrect.','auth/wrong-password':'Mot de passe incorrect.','auth/user-not-found':'Compte inconnu.','auth/too-many-requests':'Trop d’essais : réessaie dans quelques minutes.','auth/network-request-failed':'Pas de connexion internet.'};
    err.textContent=m[x.code]||x.message;
  }).then(function(){ btn.disabled=false; btn.textContent='Se connecter'; });
});
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
render();
